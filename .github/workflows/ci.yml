name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/ScreenLeash/ScreenLeash.csproj -c Release --nologo

      - name: Test (all)
        run: dotnet test tests/ScreenLeash.Tests/ScreenLeash.Tests.csproj -c Release --nologo

      - name: Raw-pixel gate (verify-metrics)
        run: dotnet test tests/ScreenLeash.Tests/ScreenLeash.Tests.csproj -c Release --nologo --filter "FullyQualifiedName~NoRawPixel"
